name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/allstarlink/asl3-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build app_rpt
        run: |
          set -eu

          if [ -d /app_rpt ]; then
            # set aside the app_rpt sources used in the CI build
            mv /app_rpt /app_rpt-CI
          fi
          # use the version of app_rpt from the PR
          cp -a "$GITHUB_WORKSPACE"/app_rpt /app_rpt
          cd /
          /asl3-asterisk/build-asl3 -t source build install

      - name: Run tests
        run: |
          cd /usr/src/testsuite
          ./runtests.py -t tests/apps/rpt

